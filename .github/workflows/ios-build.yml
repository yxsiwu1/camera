name: iOS Build

# 无需 Mac、无需 Apple 开发者账号、无需签名。
# 产出：
#   trollstore : Drama-trollstore.ipa —— ldid ad-hoc 签名，TrollStore（巨魔）直接安装，
#                永久有效；也可用于 Sideloadly 重签后普通安装
#   simulator  : Drama-simulator.zip —— 需要 Mac 上的 Xcode Simulator
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "产出类型"
        type: choice
        options:
          - trollstore
          - simulator
          - both
        default: trollstore
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 Xcode 15.4（iOS 17.5 SDK）：产物对 iOS 16 真机最稳，
      # 且 React Native 0.76 / Expo SDK 52 在该版本下 pod 与编译均已验证。
      # 若 runner 日后移除 15.4，可改成 16.2（同样能在 iOS 16 上运行）。
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Toolchain info
        run: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (Expo prebuild)
        run: npx expo prebuild -p ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Install ldid (ad-hoc 签名)
        run: brew install ldid

      - name: Build + ad-hoc sign → TrollStore ipa
        if: inputs.artifact != 'simulator'
        run: bash scripts/build-ios-trollstore.sh ios/Drama-trollstore.ipa

      - name: Build simulator app
        if: inputs.artifact == 'simulator' || inputs.artifact == 'both'
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -workspace Drama.xcworkspace \
            -scheme Drama \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -qry ../../../../Drama-simulator.zip Drama.app
          ls -lh ../../../../Drama-simulator.zip

      - name: Upload TrollStore ipa
        if: inputs.artifact != 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: Drama-trollstore-ipa
          path: ios/Drama-trollstore.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload simulator app
        if: inputs.artifact == 'simulator' || inputs.artifact == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Drama-simulator-app
          path: ios/Drama-simulator.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach ipa to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v') && inputs.artifact != 'simulator'
        uses: softprops/action-gh-release@v2
        with:
          files: ios/Drama-trollstore.ipa
          generate_release_notes: true
